<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | SoftPay</title>
    <meta name="description" content="A página que você procura não existe ou foi movida. Volte para a página inicial do SoftPay." />
    <meta name="robots" content="noindex, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="icon" href="/assets/icones e favicon.svg" type="image/svg+xml" />
    <style>
        :root {
            --azul: #1DA1F2;
            --azul-escuro: #0673BC;
            --cinza-900: #0F1B2D;
            --cinza-600: #4A5768;
            --cinza-200: #E1E7EE;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
            background: #F7F9FB;
            color: var(--cinza-900);
        }

        .box { max-width: 560px; text-align: center; }

        .logo { width: 150px; height: auto; margin-bottom: 2.5rem; }

        .codigo {
            font-size: clamp(3.5rem, 14vw, 6rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #1DA1F2 0%, #0673BC 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            font-size: clamp(1.35rem, 4vw, 1.75rem);
            font-weight: 700;
            margin: 0.75rem 0 0.75rem;
        }

        p { color: var(--cinza-600); line-height: 1.75; margin-bottom: 2rem; }

        .acoes { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }

        .btn {
            display: inline-block;
            padding: 0.85rem 1.65rem;
            border-radius: 0.625rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 150ms ease, box-shadow 150ms ease;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn-primario {
            background: linear-gradient(135deg, #1DA1F2 0%, #0673BC 100%);
            color: #fff;
            box-shadow: 0 8px 24px rgba(29, 161, 242, 0.28);
        }

        .btn-secundario {
            background: #fff;
            color: var(--cinza-900);
            border: 1px solid var(--cinza-200);
        }

        .links { margin-top: 2.5rem; font-size: 0.9rem; color: var(--cinza-600); }
        .links a { color: var(--azul-escuro); text-decoration: none; font-weight: 600; }
        .links a:hover { text-decoration: underline; }

        :where(a):focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }
    </style>
</head>

<body>
    <main class="box">
        <img src="/assets/logo.png" alt="SoftPay" class="logo" width="150" height="40" />
        <p class="codigo">404</p>
        <h1>Essa página não existe</h1>
        <p>
            O endereço pode ter mudado ou o link estava errado.
            Volte para a página inicial e continue de lá.
        </p>
        <div class="acoes">
            <a href="/" class="btn btn-primario">Ir para a página inicial</a>
            <a href="https://wa.me/558698193851?text=Olá!%20Tenho%20uma%20dúvida%20sobre%20o%20SoftPay."
                target="_blank" rel="noopener" class="btn btn-secundario">Falar com o suporte</a>
        </div>
        <p class="links">
            Atalhos: <a href="/#pricing">Preços</a> · <a href="/#faq">Perguntas frequentes</a> ·
            <a href="/#segmentos">Para o seu negócio</a>
        </p>
    </main>
</body>

</html>
