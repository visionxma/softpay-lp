name: Deploy para a Cloudflare

# Publica a landing page na Cloudflare (Workers Static Assets) a cada push
# na branch principal. Também pode ser disparado manualmente pela aba Actions.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

# Uma publicação por vez: se dois pushes acontecerem juntos, o mais novo vence.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Publicar na Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
