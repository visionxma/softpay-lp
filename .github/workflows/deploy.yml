name: Deploy para o Cloudflare Pages

# ATENÇÃO: use este workflow OU a integração Git do painel do Cloudflare
# Pages — nunca os dois, senão cada push gera duas publicações.
#
# Se você conectou o repositório pelo painel (Workers & Pages → Create →
# Pages → Connect to Git), o deploy já é automático e este workflow serve
# apenas como disparo manual de emergência.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch de destino no Pages (production = branch de produção)'
        required: false
        default: 'main'

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name=softpay-lp
            --branch=${{ inputs.branch }}
